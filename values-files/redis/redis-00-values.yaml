redis:
  enabled: true

  replica:
    enabled: false

  service:
    type: ClusterIP
    port: 6379

  dataStorage:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    keepOnUninstall: true

  auth:
    enabled: false

  extraConfig: |
    appendonly yes

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
