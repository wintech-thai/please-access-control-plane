
freeradius:
  enabled: true

  # ==========================================
  # FreeRADIUS
  # ==========================================

  replicaCount: 1

  # ==========================================
  # PostgreSQL Subchart
  # ==========================================

  postgresql:
    enabled: true
    architecture: standalone

    auth:
      username: radius
      database: radius

      existingSecret: onix-postgres-secret

      secretKeys:
        adminPasswordKey: adminPasswordKey
        userPasswordKey: userPasswordKey

  # ==========================================
  # FreeRADIUS SQL Module
  # ==========================================

  modules:
    sql:
      enabled: true
      dialect: postgresql
      read_clients: true

  # ==========================================
  # Networking
  # ==========================================

  gateway:
    enabled: false

  service:
    type: ClusterIP

  # ==========================================
  # Resources
  # ==========================================

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
