apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onix-api-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.domainOnixAPI }}
  rules:
    - host: {{ .Values.domainOnixAPI }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: please-access-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
